[project]
name = "platsbanken-mcp"
version = "0.1.0"
description = "MCP server for Swedish job ads (Platsbanken) via Arbetsförmedlingen's open JobTech API"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rickard Åberg" }]
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2,<2", "httpx>=0.27"]
keywords = ["mcp", "jobs", "sweden", "platsbanken", "arbetsformedlingen", "jobtech"]

[project.scripts]
platsbanken-mcp = "platsbanken_mcp.server:main"

[project.urls]
Repository = "https://github.com/kizouker/platsbanken-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
