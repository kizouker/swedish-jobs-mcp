[project]
name = "platsbanken-mcp"
version = "0.1.0"
description = "MCP server for Swedish job ads (Platsbanken) via Arbetsförmedlingen's open JobTech API"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rickard Åberg" }]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2,<2",
    "httpx>=0.27",
    "debugpy>=1.8.22",
]
keywords = ["mcp", "jobs", "sweden", "platsbanken", "arbetsformedlingen", "jobtech"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: calls the real JobTech API (run with -m live)",
    "e2e: starts the server as a real process and talks MCP to it (offline)",
]
addopts = "-m 'not live'"

[project.scripts]
platsbanken-mcp = "platsbanken_mcp.server:main"

[project.urls]
Repository = "https://github.com/kizouker/platsbanken-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
